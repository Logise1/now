<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How many people are doing ___ now?</title>
  <meta name="description" content="A live guess at what humanity is up to, right now.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>?</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <main>
    <header class="hero">
      <h1>
        How many people are doing
        <button type="button" id="blank" class="blank is-empty is-typing" aria-label="Choose an activity"></button>
        now?
      </h1>
    </header>

    <section id="list" class="panel list" aria-label="Activities"></section>
    <section id="detail" class="panel detail hidden" aria-live="polite"></section>
  </main>

  <footer>
    <p>modelled from ATUS, OECD time-use, UN, ILO, ITU and WHO, then shaped by local clocks. not a census.</p>
  </footer>
  <p class="credit">Made by logise</p>
  <script src="app.js"></script>
</body>
</html>
